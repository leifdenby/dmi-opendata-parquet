services:
  updater:
    build: .
    environment:
      TQDM_DISABLE: "1"
    command:
      - update
      - --start
      - "${DMI_START_DATE:-2025-01-01}"
      - --interval-hours
      - "${DMI_UPDATE_INTERVAL_HOURS:-3}"
      - --cache
      - /app/tmp/cache
      - --output
      - /app/data/dmi
    volumes:
      - ./data:/app/data
      - ./tmp/cache:/app/tmp/cache
    restart: unless-stopped

  s3-listing:
    build: .
    command: [serve-s3-listing, --root, /app/data/dmi, --bucket, s3, --port, "9000"]
    volumes:
      - ./data/dmi:/app/data/dmi:ro
    restart: unless-stopped

  server:
    image: nginx:1.27-alpine
    depends_on:
      - s3-listing
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./data/dmi:/usr/share/nginx/html:ro
      - ./data/dmi:/usr/share/nginx/s3/s3:ro
      - ./docker/status:/usr/share/nginx/status:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
