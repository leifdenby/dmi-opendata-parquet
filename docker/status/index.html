<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMI GeoParquet status</title>
<style>
  :root {
    --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --card: #ffffff; --line: #e2e2dd;
    --done: #2e7d4f; --done-bg: #e3f2e8; --processing: #1d5fa8; --processing-bg: #e1ecf8;
    --waiting: #6b6b66; --waiting-bg: #ececea; --error: #b3261e; --error-bg: #fbe4e2;
    --empty: #8a6d1d; --empty-bg: #f6efd9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --fg: #ececea; --muted: #9a9a94; --card: #1f1f1e; --line: #33332f;
      --done: #7fd19c; --done-bg: #1d3326; --processing: #8ab8ec; --processing-bg: #1b2a3d;
      --waiting: #a5a5a0; --waiting-bg: #2a2a28; --error: #f2948d; --error-bg: #3d1f1d;
      --empty: #e0c271; --empty-bg: #352e1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .sub a { color: inherit; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: 12px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 18px; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: var(--waiting-bg); overflow: hidden;
         display: flex; margin-bottom: 20px; }
  .bar span { display: block; height: 100%; }
  .wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  tr:last-child td { border-bottom: 0; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .s-done { color: var(--done); background: var(--done-bg); }
  .s-processing { color: var(--processing); background: var(--processing-bg); }
  .s-waiting { color: var(--waiting); background: var(--waiting-bg); }
  .s-error { color: var(--error); background: var(--error-bg); }
  .s-empty { color: var(--empty); background: var(--empty-bg); }
  .meta { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .err { color: var(--error); font-size: 12px; display: block; white-space: normal; max-width: 280px; }
  td a { color: inherit; }
  .notice { padding: 16px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>DMI GeoParquet status</h1>
  <p class="sub">Each block is one parameter for one month; a month's final file is built as soon as
    its blocks finish. Files: <a href="raw/">raw/</a>
    · <a href="_status.json">_status.json</a> · <span id="updated">loading…</span></p>
  <div class="cards" id="cards"></div>
  <div class="bar" id="bar"></div>
  <div class="wrap"><div class="notice" id="table">Loading status…</div></div>
</main>
<script>
const STATES = ["done", "processing", "waiting", "empty", "error"];
const LABELS = { done: "done", processing: "processing", waiting: "waiting", empty: "no data", error: "error" };

function esc(value) {
  return String(value ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}
function ago(iso) {
  if (!iso) return "—";
  const s = Math.round((Date.now() - Date.parse(iso)) / 1000);
  const abs = Math.abs(s);
  const txt = abs < 90 ? `${abs}s` : abs < 5400 ? `${Math.round(abs / 60)}m` : `${(abs / 3600).toFixed(1)}h`;
  return s >= 0 ? `${txt} ago` : `in ${txt}`;
}
function badge(state) {
  return `<span class="badge s-${state}">${LABELS[state] ?? esc(state)}</span>`;
}
function rows(n) {
  return n == null ? "" : `<span class="meta">${Number(n).toLocaleString()} rows</span>`;
}

function render(status) {
  const blocks = Object.values(status.blocks || {});
  const counts = Object.fromEntries(STATES.map((s) => [s, 0]));
  blocks.forEach((b) => { counts[b.state] = (counts[b.state] || 0) + 1; });
  const cycle = status.cycle || {};
  const partitions = status.partitions || {};
  const finals = Object.values(partitions);
  const finalsDone = finals.filter((f) => f.state === "done").length;

  document.getElementById("updated").textContent = `status updated ${ago(status.updated_at)}`;
  const cards = [
    ["Update cycle", cycle.state === "running" ? `running · started ${ago(cycle.started_at)}`
      : `${cycle.state || "idle"} · finished ${ago(cycle.finished_at)}`],
    ["Next run", status.next_run_at ? ago(status.next_run_at) : cycle.state === "running" ? "after this run" : "—"],
    ["Final files", `${finalsDone} / ${finals.length}`],
    ...STATES.map((s) => [LABELS[s], counts[s]]),
  ];
  document.getElementById("cards").innerHTML = cards
    .map(([k, v]) => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`)
    .join("");
  const total = blocks.length || 1;
  document.getElementById("bar").innerHTML = STATES
    .map((s) => `<span class="s-${s}" style="width:${(100 * counts[s]) / total}%;background:var(--${s})"></span>`)
    .join("");

  const params = status.parameters || [];
  const periods = [...new Set(blocks.map((b) => b.period))].sort().reverse();
  if (!periods.length) {
    document.getElementById("table").outerHTML = `<div class="notice" id="table">No blocks yet.</div>`;
    return;
  }
  const head = `<tr><th>Month</th>${params.map((p) => `<th>${esc(p)}</th>`).join("")}<th>Final file</th></tr>`;
  const body = periods.map((period) => {
    const cells = params.map((p) => {
      const b = (status.blocks || {})[`${p}/${period}`];
      if (!b) return "<td>—</td>";
      const title = [b.modified_at && `file written ${b.modified_at}`, b.refresh && "refreshed every cycle"]
        .filter(Boolean).join(" · ");
      const err = b.state === "error" ? `<span class="err">${esc(b.error)}</span>` : "";
      return `<td title="${esc(title)}">${badge(b.state)}${rows(b.rows)}${err}</td>`;
    }).join("");
    const part = partitions[period];
    let final = "—";
    if (part) {
      const link = part.path
        ? ` <a href="${esc(part.path)}">${esc(part.path.split("/").slice(-3, -1).join("/"))}</a>`
        : "";
      const err = part.state === "error" ? `<span class="err">${esc(part.error)}</span>` : "";
      final = `${badge(part.state)}${link}${rows(part.rows)}${err}`;
    }
    return `<tr><td>${esc(period)}</td>${cells}<td>${final}</td></tr>`;
  }).join("");
  document.getElementById("table").outerHTML =
    `<div id="table"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

async function refresh() {
  try {
    const response = await fetch("_status.json", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    render(await response.json());
  } catch (err) {
    document.getElementById("updated").textContent = `status unavailable (${err.message}) — the updater may not have started yet`;
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
