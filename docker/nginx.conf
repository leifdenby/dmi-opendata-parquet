server {
    listen 80;
    root /usr/share/nginx/html;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers Range always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;

    # Status page, served from its own directory so it is not part of the dataset.
    location = / {
        root /usr/share/nginx/status;
        try_files /index.html =404;
    }

    location = /pyodide.html {
        root /usr/share/nginx/status;
    }

    location = /_status.json {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        autoindex on;
    }

    # Read-only S3 API for bucket "s3" (path-style, endpoint = this server).
    # Bucket-level requests (listing) go to the listing service; object GET/HEAD
    # requests are served here, from a mount at <s3 root>/s3/.
    location = /s3 {
        proxy_pass http://s3-listing:9000;
    }

    location = /s3/ {
        proxy_pass http://s3-listing:9000;
    }

    location /s3/ {
        root /usr/share/nginx/s3;
        try_files $uri =404;
    }

    location = /healthz {
        return 200 "ok\n";
    }
}
