repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: python
        additional_dependencies:
          - ruff
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: python
        additional_dependencies:
          - ruff
        types_or: [python, pyi, jupyter]
      - id: ty
        name: ty check
        entry: ty check
        language: python
        additional_dependencies:
          - ty
        types: [python]
