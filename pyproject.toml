[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmi-geoparquet"
version = "0.1.0"
description = "Build GeoParquet datasets from DMI weather station observations"
readme = "PLAN.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=15.0",
  "matplotlib>=3.9",
  "tqdm>=4.66",
  "xarray>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pre-commit",
  "pytest",
  "nbclient",
  "nbformat",
  "nbmake",
  "ipykernel",
  "ruff",
  "ty",
]

[project.scripts]
dmi-geoparquet = "dmi_geoparquet.cli:main"

[tool.setuptools]
packages = [
  "dmi_geoparquet",
  "dmi_geoparquet.estimate",
  "dmi_geoparquet.download",
  "dmi_geoparquet.build",
  "dmi_geoparquet.update",
  "dmi_geoparquet.serve",
]

[dependency-groups]
dev = [
  "pre-commit",
  "pytest",
  "nbclient",
  "nbformat",
  "nbmake",
  "ipykernel",
  "ruff",
  "ty",
]
viz = [
    "ipykernel>=7.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["dmi_geoparquet"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.format]
quote-style = "double"
