[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmi-geoparquet"
version = "0.1.0"
description = "Build GeoParquet datasets from DMI weather station observations"
readme = "PLAN.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=15.0",
]

[project.scripts]
dmi-geoparquet = "dmi_geoparquet.cli:main"

[tool.setuptools]
packages = ["dmi_geoparquet"]
